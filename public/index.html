<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Die geheimste Gewinnshow der Welt</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <section id="home" class="panel hero">
      <p class="eyebrow">LIVE QUIZ ARENA</p>
      <h1>Die geheimste<br>Gewinnshow der Welt</h1>
      <p class="lead">Hoste eine Session oder tritt mit einem 6-stelligen Code bei.</p>
      <div class="actions">
        <button id="createBtn" class="primary">Session hosten</button>
        <button id="joinOpenBtn" class="secondary">Session beitreten</button>
      </div>
    </section>

    <section id="join" class="panel hidden">
      <button class="back" data-back>← Zurück</button>
      <h2>Session beitreten</h2>
      <label>Session-Code<input id="codeInput" inputmode="numeric" maxlength="6" placeholder="123456" /></label>
      <label>Username<input id="usernameInput" maxlength="24" placeholder="Dein Name" /></label>
      <button id="joinBtn" class="primary">Arena betreten</button>
      <p id="joinError" class="error"></p>
    </section>

    <section id="lobby" class="panel hidden">
      <p class="eyebrow">SESSION</p>
      <div id="sessionCode" class="code">------</div>
      <h2 id="lobbyTitle">Lobby</h2>
      <p id="lobbyHint" class="lead"></p>
      <div id="players" class="players"></div>
      <button id="startBtn" class="primary hidden">Spiel starten</button>
    </section>

    <section id="game" class="panel hidden">
      <div class="gameTop">
        <span id="questionCount" class="eyebrow"></span>
        <span id="score" class="score"></span>
      </div>
      <h2 id="questionText" class="question"></h2>
      <div id="answers" class="answers"></div>
      <div id="hostStatus" class="hostStatus hidden"></div>
      <button id="nextBtn" class="primary hidden">Nächste Frage</button>
    </section>

    <section id="finished" class="panel hidden">
      <p class="eyebrow">FINALE</p>
      <h2>Spiel beendet</h2>
      <div id="ranking" class="ranking"></div>
      <button id="reloadBtn" class="primary">Neue Session</button>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
